[package]
name = "glrmask"
version = "0.1.1"
edition = "2024"
autotests = false
description = "Extremely fast grammar-constrained decoding for LLMs"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/glrmask"
repository = "https://github.com/IsaacBreen/glrmask"
keywords = ["grammar", "llm", "decoding", "parser", "json-schema"]
categories = ["algorithms", "parsing"]
exclude = [
    ".agents/**",
    ".benchmarks/**",
    ".cache/**",
    "python/**",
    "scripts/**",
    "target/**",
]

[features]
default = []
internal-api = []

[[example]]
name = "composition_component_candidates"
required-features = ["internal-api"]

[dependencies]
glrmask-finite-automata = { version = "=0.1.1", path = "crates/glrmask-finite-automata" }
glrmask-weight = { version = "=0.1.1", path = "crates/glrmask-weight", features = ["internal-api"] }
glrmask-weighted-automata = { version = "=0.1.1", path = "crates/glrmask-weighted-automata" }
glrmask-vocab = { version = "=0.1.1", path = "crates/glrmask-vocab", features = ["internal-api"] }
glrmask-lexer = { version = "=0.1.1", path = "crates/glrmask-lexer", features = ["internal-api"] }
glrmask-grammar = { version = "=0.1.1", path = "crates/glrmask-grammar", features = ["internal-api"] }
glrmask-glr = { version = "=0.1.1", path = "crates/glrmask-glr", features = ["internal-api"] }
glrmask-json-schema = { version = "=0.1.1", path = "crates/glrmask-json-schema", features = ["internal-api"] }
glrmask-artifact = { version = "=0.1.1", path = "crates/glrmask-artifact", features = ["internal-api"] }
glrmask-invariant = { version = "=0.1.1", path = "crates/glrmask-invariant", features = ["internal-api"] }
glrmask-terminal-dwa = { version = "=0.1.1", path = "crates/glrmask-terminal-dwa", features = ["internal-api"] }
glrmask-parser-dwa = { version = "=0.1.1", path = "crates/glrmask-parser-dwa", features = ["internal-api"] }
rustc-hash = "1"
ahash = "0.8"
smallvec = { version = "1", features = ["serde"] }
im = "15"
range-set-blaze = "0.3.0"
hashbrown = "0.15"
once_cell = "1"
blake3 = "1"

serde = { version = "1", features = ["derive", "rc"] }
bincode = "1"
zstd = { version = "0.13", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
regex-syntax = "0.8"
derivre = { version = "=0.3.8", default-features = false, features = ["compress"] }

rayon = "1"
dashmap = "6"
rand = "0.8"
thiserror = "1"

[dev-dependencies]
criterion = "0.5"
pretty_assertions = "1"
# Enable the unstable bridge only while building this package's tests,
# examples, and benchmarks. Normal dependency builds keep the narrow API.
glrmask_internal_dev = { package = "glrmask", path = ".", features = ["internal-api"] }

[[bench]]
name = "cfa_sweep_schema_build_single_threaded"
harness = false

[[bench]]
name = "cfa_sweep_schema_build_multithreaded"
harness = false

[[bench]]
name = "bounded_string_array_close"
harness = false

[[example]]
name = "profile_glr"

[[example]]
name = "selected10_programmatic_tools"
required-features = ["internal-api"]

# Public API suites.
[[test]]
name = "final_public_api_review"
path = "tests/final_public_api_review.rs"

[[test]]
name = "final_public_api"
path = "tests/final_public_api.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "end_tokens"
path = "tests/end_tokens.rs"

[[test]]
name = "glrm_v1"
path = "tests/glrm_v1.rs"

# Focused JSON Schema suites.
[[test]]
name = "json_schema_unicode_class_pattern"
path = "tests/json_schema/unicode_class_pattern.rs"

[[test]]
name = "json_schema_unicode_escape_characterization"
path = "tests/json_schema/unicode_escape_characterization.rs"

# General regression collection.
[[test]]
name = "mre"
path = "tests/regressions/mre.rs"

# Parser and GSS regressions.
[[test]]
name = "direct_glrm_ordered_suffix_ambiguity"
path = "tests/regressions/parser/direct_glrm_ordered_suffix_ambiguity.rs"

[[test]]
name = "direct_glrm_ordered_suffix_fixed_n5"
path = "tests/regressions/parser/direct_glrm_ordered_suffix_fixed_n5.rs"

[[test]]
name = "ordered_anyof_ambiguity"
path = "tests/regressions/parser/ordered_anyof_ambiguity.rs"

[[test]]
name = "o13029_unit_inlining_false_negative"
path = "tests/regressions/parser/o13029_unit_inlining_false_negative.rs"

[[test]]
name = "o15627_schema_gss_split_mre"
path = "tests/regressions/parser/o15627_schema_gss_split.rs"

# JSON Schema regressions keyed by corpus/problem ID.
[[test]]
name = "o17408_repro"
path = "tests/regressions/json_schema/o17408_false_positive.rs"

[[test]]
name = "o25804_mask_commit_mismatch"
path = "tests/regressions/json_schema/o25804_mask_commit_mismatch.rs"

[[test]]
name = "word_limit_totality"
path = "tests/regressions/json_schema/word_limit_totality.rs"

[[test]]
name = "o4836_unicode_escape_key"
path = "tests/regressions/json_schema/o4836_unicode_escape_key.rs"

[[test]]
name = "o6363_required_anyof"
path = "tests/regressions/json_schema/o6363_required_anyof.rs"

[[test]]
name = "o67291_recursive_anyof_ref"
path = "tests/regressions/json_schema/o67291_recursive_anyof_ref.rs"

[[test]]
name = "o82710_repro"
path = "tests/regressions/json_schema/o82710_whitespace.rs"

[[test]]
name = "resjson_repro"
path = "tests/regressions/json_schema/resjson_recursive_ref.rs"

# Tokenizer and lexical-state regressions.
[[test]]
name = "byte_restricted_state_equivalence_mre"
path = "tests/regressions/tokenizer/byte_restricted_state_equivalence.rs"

[[test]]
name = "o35155_tokenizer_scaling"
path = "tests/regressions/tokenizer/o35155_scaling.rs"

[[test]]
name = "unicode_escape_progression_glrm_mre"
path = "tests/regressions/tokenizer/unicode_escape_progression.rs"

# Terminal-interchangeability regressions.
[[test]]
name = "ti_mre_final"
path = "tests/regressions/terminal_interchangeability/shared_suffix.rs"

[[test]]
name = "ti_separator_transport_mre"
path = "tests/regressions/terminal_interchangeability/separator_transport.rs"

# Replay regressions with checked-in generated fixtures.
[[test]]
name = "snowplow_hostname_replay_mre"
path = "tests/regressions/replay/snowplow_hostname.rs"

[workspace]
members = [
    ".",
    "python",
    "crates/glrmask-finite-automata",
    "crates/glrmask-weight",
    "crates/glrmask-weighted-automata",
    "crates/glrmask-vocab",
    "crates/glrmask-lexer",
    "crates/glrmask-grammar",
    "crates/glrmask-glr",
    "crates/glrmask-json-schema",
    "crates/glrmask-artifact",
    "crates/glrmask-invariant",
    "crates/glrmask-terminal-dwa",
    "crates/glrmask-parser-dwa",
    "crates/glrmask-dwa-merge",
]
resolver = "2"

[[test]]
name = "integer_multiple_exact"
path = "tests/regressions/json_schema/integer_multiple_exact.rs"

[[test]]
name = "template_parser_artifact"
path = "tests/template_parser_artifact.rs"
required-features = ["internal-api"]

[[test]]
name = "template_parser_provider"
path = "tests/template_parser_provider.rs"

[[test]]
name = "template_parser_composition"
path = "tests/template_parser_composition.rs"
required-features = ["internal-api"]

[[test]]
name = "packed_final_mask_cache"
path = "tests/packed_final_mask_cache.rs"
required-features = ["internal-api"]

[[test]]
name = "template_parser_static"
path = "tests/template_parser_static.rs"
required-features = ["internal-api"]

[[test]]
name = "template_parser_static_oracle"
path = "tests/template_parser_static_oracle.rs"
required-features = ["internal-api"]

# Older supported Rust toolchains can misalign a stripped Mach-O string pool,
# which prevents Python from loading the extension on macOS 27. This affects
# only the Python shared library, not runtime artifacts or native benchmarks.
# Upstream tracking: https://github.com/rust-lang/rust/issues/157750
[profile.release.package._glrmask]
strip = "none"
