[package]
name = "glrmask-weighted-automata"
version = "0.1.1"
edition = "2024"
description = "Weighted NWA and DWA algorithms used by GLRMask"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IsaacBreen/glrmask"

[dependencies]
glrmask-weight = { version = "=0.1.1", path = "../glrmask-weight", features = ["internal-api"] }
range-set-blaze = { path = "../../../range-set-blaze" }
rayon = "1"
rustc-hash = "1"
serde = { version = "1", features = ["derive", "rc"] }
smallvec = { version = "1", features = ["serde"] }
thiserror = "1"

[dev-dependencies]
bincode = "1"
