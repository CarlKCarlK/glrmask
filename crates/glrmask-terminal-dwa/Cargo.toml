[package]
name = "glrmask-terminal-dwa"
version = "0.1.1"
edition = "2024"
description = "Vocabulary and lexer to terminal-DWA compiler for GLRMask"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IsaacBreen/glrmask"

[features]
default = []
internal-api = []

[dependencies]
ahash = "0.8"
blake3 = "1"
derivre = { version = "=0.3.8", default-features = false, features = ["compress"] }
serde_json = "1"
glrmask-artifact = { version = "=0.1.1", path = "../glrmask-artifact", features = ["internal-api"] }
glrmask-finite-automata = { version = "=0.1.1", path = "../glrmask-finite-automata" }
glrmask-dwa-merge = { version = "=0.1.1", path = "../glrmask-dwa-merge", features = ["internal-api"] }
glrmask-glr = { version = "=0.1.1", path = "../glrmask-glr", features = ["internal-api"] }
glrmask-grammar = { version = "=0.1.1", path = "../glrmask-grammar", features = ["internal-api"] }
glrmask-invariant = { version = "=0.1.1", path = "../glrmask-invariant", features = ["internal-api"] }
glrmask-lexer = { version = "=0.1.1", path = "../glrmask-lexer", features = ["internal-api"] }
glrmask-vocab = { version = "=0.1.1", path = "../glrmask-vocab", features = ["internal-api"] }
glrmask-weight = { version = "=0.1.1", path = "../glrmask-weight", features = ["internal-api"] }
glrmask-weighted-automata = { version = "=0.1.1", path = "../glrmask-weighted-automata" }
hashbrown = "0.15"
once_cell = "1"
range-set-blaze = "0.8.0"
rayon = "1"
regex-syntax = "0.8"
rustc-hash = "1"
serde = { version = "1", features = ["derive"] }
smallvec = { version = "1", features = ["serde"] }
thiserror = "1"

[[example]]
name = "l1_reference"
required-features = ["internal-api"]
